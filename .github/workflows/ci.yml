name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate extension version alignment
        run: npm run check:extension-version

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate source Wrangler config
        run: npm run deploy:source-dry-run

      - name: Validate D1 deploy resolver
        env:
          DOCKMARK_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
        run: |
          npm run prepare:cloudflare-deploy
          npm run resolve:cloudflare-d1

      - name: Simulate Workers Builds preview preparation
        env:
          WORKERS_CI: "1"
          WORKERS_CI_BRANCH: preview-test
          DOCKMARK_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
        run: npm run prepare:workers-build

      - name: Cloudflare deploy dry run
        run: npm run deploy:dry-run

  chromium-extension:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Chromium extension
        run: npm run build:extension

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps --no-shell chromium

      - name: Web responsive shell smoke test
        run: npm run smoke:chromium:web-shell

      - name: Standard Chromium extension smoke test
        run: npm run smoke:chromium

      - name: Package Chromium extension
        run: npm run package:extension

      - name: Package New Tab Chromium variant
        run: npm run package:extension:newtab

      - name: New Tab local-first offline smoke test
        run: npm run smoke:chromium:newtab

      - name: Validate Chromium packages
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          STANDARD="apps/extension/.output/dockmark-chrome-v${VERSION}.zip"
          NEWTAB="apps/extension/.output/dockmark-newtab-chrome-v${VERSION}.zip"
          test -f "$STANDARD"
          test -f "$NEWTAB"
          unzip -Z1 "$STANDARD" | grep -qx "manifest.json"
          unzip -Z1 "$NEWTAB" | grep -qx "manifest.json"
          unzip -Z1 "$NEWTAB" | grep -qx "newtab.html"
          unzip -Z1 "$NEWTAB" | grep -qx "newtab.js"
          unzip -Z1 "$NEWTAB" | grep -qx "newtab-auth.js"
          unzip -Z1 "$NEWTAB" | grep -qx "newtab.css"
          unzip -p "$STANDARD" manifest.json | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const m=JSON.parse(data); if (m.chrome_url_overrides) process.exit(1); });'
          unzip -p "$NEWTAB" manifest.json | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const m=JSON.parse(data); if (m.chrome_url_overrides?.newtab !== "newtab.html") process.exit(1); if (m.name !== "Dockmark New Tab") process.exit(1); });'

      - name: Stage Chromium packages
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          mkdir -p artifacts
          cp "apps/extension/.output/dockmark-chrome-v${VERSION}.zip" artifacts/
          cp "apps/extension/.output/dockmark-newtab-chrome-v${VERSION}.zip" artifacts/

      - name: Upload Chromium packages
        uses: actions/upload-artifact@v4
        with:
          name: dockmark-chromium-extension
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  firefox-extension:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Firefox MV3 extension
        run: npm run build:extension:firefox

      - name: Package Firefox MV3 extension
        run: npm run package:extension:firefox

      - name: Validate Firefox package and sources
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          STANDARD="apps/extension/.output/dockmark-firefox-v${VERSION}.zip"
          SOURCES="apps/extension/.output/dockmark-firefox-sources-v${VERSION}.zip"
          test -f "$STANDARD"
          test -f "$SOURCES"
          unzip -Z1 "$STANDARD" | grep -qx "manifest.json"
          unzip -Z1 "$SOURCES" | grep -qx "package.json"
          unzip -Z1 "$SOURCES" | grep -qx "wxt.config.ts"
          unzip -p "$STANDARD" manifest.json | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const m=JSON.parse(data); const permissions=new Set(m.permissions || []); const optional=new Set(m.optional_permissions || []); const hosts=new Set(m.optional_host_permissions || []); const gecko=m.browser_specific_settings?.gecko; if (m.manifest_version !== 3) throw new Error("Firefox package must target MV3"); if (m.chrome_url_overrides) throw new Error("Firefox Standard package must not override New Tab"); for (const permission of ["storage","tabs","scripting"]) if (!permissions.has(permission)) throw new Error(`Missing ${permission} permission`); if (!optional.has("bookmarks")) throw new Error("Bookmarks must remain optional"); if (!hosts.has("http://*/*") || !hosts.has("https://*/*")) throw new Error("Host access must remain optional for HTTP(S)"); if (gecko?.id !== "dockmark@imwarn.github.io") throw new Error("Firefox package must have a stable Gecko id"); if (!gecko?.data_collection_permissions?.required?.includes("none")) throw new Error("Firefox package must declare no required data collection"); });'

      - name: Stage Firefox packages
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          mkdir -p artifacts
          cp "apps/extension/.output/dockmark-firefox-v${VERSION}.zip" artifacts/
          cp "apps/extension/.output/dockmark-firefox-sources-v${VERSION}.zip" artifacts/

      - name: Upload Firefox packages
        uses: actions/upload-artifact@v4
        with:
          name: dockmark-firefox-extension
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
