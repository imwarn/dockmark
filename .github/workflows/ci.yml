name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate source Wrangler config
        run: npm run deploy:source-dry-run

      - name: Validate D1 deploy resolver
        env:
          DOCKMARK_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
        run: |
          npm run prepare:cloudflare-deploy
          npm run resolve:cloudflare-d1

      - name: Simulate Workers Builds preview preparation
        env:
          WORKERS_CI: "1"
          WORKERS_CI_BRANCH: preview-test
          DOCKMARK_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
        run: npm run prepare:workers-build

      - name: Cloudflare deploy dry run
        run: npm run deploy:dry-run

  chromium-extension:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Chromium extension
        run: npm run build:extension

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps --no-shell chromium

      - name: Chromium extension smoke test
        run: npm run smoke:chromium

      - name: Package Chromium extension
        run: npm run package:extension

      - name: Validate Chromium package
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          PACKAGE="apps/extension/.output/dockmark-chrome-v${VERSION}.zip"
          test -f "$PACKAGE"
          unzip -Z1 "$PACKAGE" | grep -qx "manifest.json"

      - name: Stage Chromium package
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          mkdir -p artifacts
          cp "apps/extension/.output/dockmark-chrome-v${VERSION}.zip" artifacts/

      - name: Upload Chromium package
        uses: actions/upload-artifact@v4
        with:
          name: dockmark-chromium-extension
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
