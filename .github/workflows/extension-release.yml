name: Extension Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/extension/**"
      - "apps/web/src/extension-distribution.ts"
      - "scripts/rename-extension-package.mjs"
      - ".github/workflows/extension-release.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          TAG="v${VERSION}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.release.outputs.exists != 'true'
        run: npm install --no-audit --no-fund

      - name: Typecheck extension
        if: steps.release.outputs.exists != 'true'
        run: npm run typecheck -w @dockmark/extension

      - name: Package Chromium extension
        if: steps.release.outputs.exists != 'true'
        run: npm run package:extension

      - name: Validate Chromium package
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE="apps/extension/.output/dockmark-chrome-v${VERSION}.zip"
          test -f "$PACKAGE"
          unzip -Z1 "$PACKAGE" | grep -qx "manifest.json"

      - name: Stage Chromium package
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp "apps/extension/.output/dockmark-chrome-v${VERSION}.zip" artifacts/

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" artifacts/*.zip --target "$GITHUB_SHA" --generate-notes --title "Dockmark $TAG"
