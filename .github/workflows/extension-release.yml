name: Extension Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/extension/**"
      - "apps/web/src/extension-distribution.ts"
      - "scripts/check-extension-version-alignment.mjs"
      - "scripts/rename-extension-package.mjs"
      - "scripts/rename-firefox-extension-package.mjs"
      - "scripts/package-newtab-extension.mjs"
      - ".github/workflows/extension-release.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          TAG="v${VERSION}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate extension version alignment
        run: node scripts/check-extension-version-alignment.mjs

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.release.outputs.exists != 'true'
        run: npm install --no-audit --no-fund

      - name: Typecheck extension
        if: steps.release.outputs.exists != 'true'
        run: npm run typecheck -w @dockmark/extension

      - name: Package Chromium extension
        if: steps.release.outputs.exists != 'true'
        run: npm run package:extension

      - name: Package New Tab Chromium variant
        if: steps.release.outputs.exists != 'true'
        run: npm run package:extension:newtab

      - name: Package Firefox MV3 extension
        if: steps.release.outputs.exists != 'true'
        run: npm run package:extension:firefox

      - name: Validate Chromium packages
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STANDARD="apps/extension/.output/dockmark-chrome-v${VERSION}.zip"
          NEWTAB="apps/extension/.output/dockmark-newtab-chrome-v${VERSION}.zip"
          test -f "$STANDARD"
          test -f "$NEWTAB"
          unzip -Z1 "$STANDARD" | grep -qx "manifest.json"
          unzip -Z1 "$NEWTAB" | grep -qx "manifest.json"
          unzip -Z1 "$NEWTAB" | grep -qx "newtab.html"
          unzip -Z1 "$NEWTAB" | grep -qx "newtab.js"
          unzip -Z1 "$NEWTAB" | grep -qx "newtab-auth.js"
          unzip -Z1 "$NEWTAB" | grep -qx "newtab.css"
          unzip -p "$STANDARD" manifest.json | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const m=JSON.parse(data); if (m.chrome_url_overrides) process.exit(1); });'
          unzip -p "$NEWTAB" manifest.json | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const m=JSON.parse(data); if (m.chrome_url_overrides?.newtab !== "newtab.html") process.exit(1); if (m.name !== "Dockmark New Tab") process.exit(1); });'

      - name: Validate Firefox package and sources
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FIREFOX="apps/extension/.output/dockmark-firefox-v${VERSION}.zip"
          SOURCES="apps/extension/.output/dockmark-firefox-sources-v${VERSION}.zip"
          test -f "$FIREFOX"
          test -f "$SOURCES"
          unzip -Z1 "$FIREFOX" | grep -qx "manifest.json"
          unzip -Z1 "$SOURCES" | grep -qx "package.json"
          unzip -Z1 "$SOURCES" | grep -qx "wxt.config.ts"
          unzip -p "$FIREFOX" manifest.json | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const m=JSON.parse(data); const permissions=new Set(m.permissions || []); const optional=new Set(m.optional_permissions || []); const hosts=new Set(m.optional_host_permissions || []); const gecko=m.browser_specific_settings?.gecko; if (m.manifest_version !== 3) throw new Error("Firefox package must target MV3"); if (m.chrome_url_overrides) throw new Error("Firefox Standard package must not override New Tab"); for (const permission of ["storage","tabs","scripting"]) if (!permissions.has(permission)) throw new Error(`Missing ${permission} permission`); if (!optional.has("bookmarks")) throw new Error("Bookmarks must remain optional"); if (!hosts.has("http://*/*") || !hosts.has("https://*/*")) throw new Error("Host access must remain optional for HTTP(S)"); if (gecko?.id !== "dockmark@imwarn.github.io") throw new Error("Firefox package must have a stable Gecko id"); if (!gecko?.data_collection_permissions?.required?.includes("none")) throw new Error("Firefox package must declare no required data collection"); });'

      - name: Stage browser packages
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp "apps/extension/.output/dockmark-chrome-v${VERSION}.zip" artifacts/
          cp "apps/extension/.output/dockmark-newtab-chrome-v${VERSION}.zip" artifacts/
          cp "apps/extension/.output/dockmark-firefox-v${VERSION}.zip" artifacts/
          cp "apps/extension/.output/dockmark-firefox-sources-v${VERSION}.zip" artifacts/

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" artifacts/*.zip --target "$GITHUB_SHA" --generate-notes --title "Dockmark $TAG"
