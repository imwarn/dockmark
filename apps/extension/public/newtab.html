<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Dockmark New Tab</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b100e; color: #e8efe9; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 10%, rgba(83, 126, 98, .14), transparent 32%), #0b100e; }
      main { width: min(560px, calc(100vw - 40px)); padding: 32px; border: 1px solid #26332c; border-radius: 22px; background: rgba(14, 21, 17, .92); box-shadow: 0 24px 80px rgba(0,0,0,.28); }
      .eyebrow { margin: 0 0 14px; color: #91bda0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(30px, 7vw, 50px); letter-spacing: -.05em; line-height: .98; }
      p { color: #8f9b94; line-height: 1.6; }
      button { margin-top: 10px; padding: 11px 16px; border: 1px solid #41604d; border-radius: 11px; background: #9bc9aa; color: #0b100e; font: inherit; font-weight: 650; cursor: pointer; }
      small { display: block; margin-top: 18px; color: #647069; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Dockmark · New Tab</p>
      <h1>Open Dockmark with every new tab.</h1>
      <p id="status">Looking for your configured Dockmark origin…</p>
      <button id="retry" type="button" hidden>Try again</button>
      <small>This page exists only in the opt-in Dockmark New Tab build. The standard Dockmark extension never replaces your browser new tab page.</small>
    </main>
    <script src="newtab.js"></script>
  </body>
</html>
